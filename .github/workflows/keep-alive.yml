# Supabase pauses free-tier projects after ~7 days without activity.
# This pings the REST API twice a week so the demo stays reachable.
name: Supabase keep-alive

on:
  schedule:
    - cron: '0 6 * * 1,4' # Mon + Thu, 06:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Ping Supabase
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::notice::SUPABASE_URL / SUPABASE_ANON_KEY not configured – skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/emission_categories?select=id&limit=1" \
            -o /dev/null
          echo "Supabase responded."
