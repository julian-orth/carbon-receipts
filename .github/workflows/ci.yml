name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

  database:
    name: Database tests + type drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v3
        with:
          version: 2.111.0

      - name: Start database
        run: supabase db start

      - name: RLS / privilege tests (pgTAP)
        run: supabase test db

      - name: Generated types are up to date
        run: |
          npm run db:types
          git diff --exit-code -- supabase/functions/_shared/database.types.ts \
            || (echo "::error::supabase/functions/_shared/database.types.ts is stale. Run 'npm run db:types' and commit." && exit 1)

  edge-functions:
    name: Edge functions (Deno typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck process-receipt
        working-directory: supabase/functions/process-receipt
        run: deno check index.ts
